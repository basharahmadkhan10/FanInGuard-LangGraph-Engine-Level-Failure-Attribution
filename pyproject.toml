[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "faningard"
version = "0.1.0"
description = "Engine-Level Failure Attribution for LangGraph: Unexpected Duplicate Node Execution at Fan-In"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Bashar Ahmad Khan", email = "9934809939khan@gmail.com" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "langgraph==1.0.10",
    "langchain-core==1.2.17",
    "networkx>=3.2",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
ui = [
    "streamlit>=1.35.0",
    "graphviz>=0.20.1",
]
benchmark = [
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
]

[project.scripts]
faningard = "faningard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
